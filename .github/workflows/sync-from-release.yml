name: Sync from App Release

on:
  repository_dispatch:
    types: [app-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (e.g. 0.0.16)"
        required: true
        type: string
      versionCode:
        description: "Version code (e.g. 16)"
        required: true
        type: string
      publishedAt:
        description: "Published at (ISO 8601, e.g. 2026-08-15T04:14:12Z)"
        required: true
        type: string
      changelog:
        description: "Changelog content (Markdown)"
        required: true
        type: string
      downloads:
        description: "Downloads JSON array"
        required: true
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Write payload to files
        env:
          EVENT_NAME: ${{ github.event_name }}
          RD_VERSION: ${{ github.event.client_payload.version }}
          RD_VERSION_CODE: ${{ github.event.client_payload.versionCode }}
          RD_PUBLISHED_AT: ${{ github.event.client_payload.publishedAt }}
          RD_CHANGELOG: ${{ github.event.client_payload.changelog }}
          RD_DOWNLOADS: ${{ github.event.client_payload.downloads }}
          WD_VERSION: ${{ inputs.version }}
          WD_VERSION_CODE: ${{ inputs.versionCode }}
          WD_PUBLISHED_AT: ${{ inputs.publishedAt }}
          WD_CHANGELOG: ${{ inputs.changelog }}
          WD_DOWNLOADS: ${{ inputs.downloads }}
        run: |
          mkdir -p /tmp/payload
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            printf '%s' "$RD_VERSION" > /tmp/payload/version
            printf '%s' "$RD_VERSION_CODE" > /tmp/payload/versionCode
            printf '%s' "$RD_PUBLISHED_AT" > /tmp/payload/publishedAt
            printf '%s' "$RD_CHANGELOG" > /tmp/payload/changelog
            printf '%s' "$RD_DOWNLOADS" > /tmp/payload/downloads
          else
            printf '%s' "$WD_VERSION" > /tmp/payload/version
            printf '%s' "$WD_VERSION_CODE" > /tmp/payload/versionCode
            printf '%s' "$WD_PUBLISHED_AT" > /tmp/payload/publishedAt
            printf '%s' "$WD_CHANGELOG" > /tmp/payload/changelog
            printf '%s' "$WD_DOWNLOADS" > /tmp/payload/downloads
          fi

          echo "=== Payload values ==="
          echo "version: $(cat /tmp/payload/version)"
          echo "versionCode: $(cat /tmp/payload/versionCode)"
          echo "publishedAt: $(cat /tmp/payload/publishedAt)"
          echo "changelog lines: $(wc -l < /tmp/payload/changelog)"
          echo "downloads: $(cat /tmp/payload/downloads)"

      - name: Fetch upstream changelog
        run: |
          # 从 rikkahub_mcp 仓库获取完整 changelog.md（公开仓库，无需认证）
          curl -sS \
            -H "Accept: application/vnd.github.v3.raw" \
            "https://api.github.com/repos/topabomb/rikkahub_mcp/contents/docs/dev/changelog.md" \
            -o /tmp/upstream-changelog.md

          if [ ! -s /tmp/upstream-changelog.md ]; then
            echo "Failed to fetch upstream changelog" >&2
            exit 1
          fi

          echo "Fetched changelog successfully ($(wc -l < /tmp/upstream-changelog.md) lines)"

      - name: Update version.json
        run: |
          # 构建静态 version.json（App 更新检查的数据源）
          # 格式与 App 端 UpdateInfo 数据模型匹配
          # 使用 jq 安全构建 JSON，从文件读取多行内容避免 shell 转义问题
          VERSION=$(cat /tmp/payload/version)
          VERSION_CODE=$(cat /tmp/payload/versionCode)
          PUBLISHED_AT=$(cat /tmp/payload/publishedAt)

          jq -n \
            --arg version "$VERSION" \
            --argjson versionCode "$VERSION_CODE" \
            --arg publishedAt "$PUBLISHED_AT" \
            --rawfile changelog /tmp/payload/changelog \
            --rawfile downloads /tmp/payload/downloads \
            '{
              version: $version,
              versionCode: $versionCode,
              publishedAt: $publishedAt,
              changelog: ($changelog | rtrimstr("\n")),
              downloads: ($downloads | rtrimstr("\n") | fromjson)
            }' > docs/.vuepress/public/version.json

          echo "Updated version.json:"
          cat docs/.vuepress/public/version.json

      - name: Update changelog page
        run: |
          # 从完整 changelog.md 构建静态 changelog/index.md
          # 保留 frontmatter + 标题 + tip，中间填充上游 changelog 正文

          cat > docs/changelog/index.md <<'FRONTMATTER'
---
title: 更新日志
icon: clock-rotate-left
author: Measix Pilot
date: 2026-08-15
category: 更新
---

# 更新日志

> 以下更新日志随每次版本发布自动同步，源自 [rikkahub_mcp 仓库](https://github.com/topabomb/rikkahub_mcp/blob/main/docs/dev/changelog.md)。

::: tip 版本线说明
Measix Pilot 采用独立版本线（`0.0.x`），与上游 RikkaHub 版本线（`2.x.x`）独立。完整的上游同步分析详见 [上游同步文档](https://github.com/topabomb/rikkahub_mcp/blob/main/docs/dev/upstream-sync.md)。
:::

<!-- CHANGELOG_CONTENT_START -->
FRONTMATTER

          # 追加上游 changelog 正文（去掉文档头部的标题和说明行）
          sed '/^# 功能迭代清单$/,/^---$/{ /^---$/!d; }' /tmp/upstream-changelog.md >> docs/changelog/index.md

          echo "" >> docs/changelog/index.md
          echo "<!-- CHANGELOG_CONTENT_END -->" >> docs/changelog/index.md

          echo "Updated changelog/index.md"

      - name: Update config.ts version info
        run: |
          VERSION=$(cat /tmp/payload/version)
          PUBLISHED_AT=$(cat /tmp/payload/publishedAt)
          PUBLISHED_DATE=$(echo "$PUBLISHED_AT" | cut -dT -f1)

          sed -i "s/softwareVersion: \".*\"/softwareVersion: \"${VERSION}\"/" docs/.vuepress/config.ts
          sed -i "s/datePublished: \".*\"/datePublished: \"${PUBLISHED_DATE}\"/" docs/.vuepress/config.ts

          echo "Updated config.ts version to ${VERSION}, date to ${PUBLISHED_DATE}"

      - name: Commit and push
        run: |
          VERSION=$(cat /tmp/payload/version)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/.vuepress/public/version.json docs/changelog/index.md docs/.vuepress/config.ts
          git commit -m "chore: sync version ${VERSION} from app release" || echo "No changes to commit"
          git push

      - name: Verify deployment
        run: |
          VERSION=$(cat /tmp/payload/version)
          echo "Waiting 60s for Vercel deployment..."
          sleep 60

          RESPONSE=$(curl -sS "https://measix-pilot.weero.net/version.json" || echo "FETCH_FAILED")
          REMOTE_VERSION=$(echo "$RESPONSE" | jq -r '.version // empty' 2>/dev/null || echo "")

          if [ "$REMOTE_VERSION" = "$VERSION" ]; then
            echo "✅ version.json verified: remote version $REMOTE_VERSION matches expected $VERSION"
          else
            echo "⚠️ version.json verification: remote version '$REMOTE_VERSION' (expected '$VERSION')"
            echo "This may be due to Vercel deployment delay. The file will be live shortly."
          fi
