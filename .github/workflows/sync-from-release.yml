name: Sync from App Release

# 当主项目 (rikkahub_mcp) 发布 Release 时，通过 repository_dispatch 触发此工作流。
# 工作流更新网站的静态 version.json、changelog 页面和 config.ts 版本信息，
# 然后 git push 触发 Vercel 自动重新部署。
#
# 也可手动触发（workflow_dispatch）用于测试。

on:
  repository_dispatch:
    types: [app-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (e.g. 0.0.16)"
        required: true
        type: string
      versionCode:
        description: "Version code (e.g. 16)"
        required: true
        type: string
      publishedAt:
        description: "Published at (ISO 8601, e.g. 2026-08-15T04:14:12Z)"
        required: true
        type: string
      changelog:
        description: "Changelog content (Markdown)"
        required: true
        type: string
      downloads:
        description: "Downloads JSON array (string)"
        required: true
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract payload
        id: payload
        env:
          PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
        run: |
          mkdir -p /tmp/payload

          if [ -n "$PAYLOAD_JSON" ]; then
            # repository_dispatch: client_payload 是 JSON 对象，用 jq 提取各字段
            echo "$PAYLOAD_JSON" | jq -r '.version'      > /tmp/payload/version
            echo "$PAYLOAD_JSON" | jq -r '.versionCode'   > /tmp/payload/versionCode
            echo "$PAYLOAD_JSON" | jq -r '.publishedAt'   > /tmp/payload/publishedAt
            echo "$PAYLOAD_JSON" | jq -r '.changelog'     > /tmp/payload/changelog
            echo "$PAYLOAD_JSON" | jq -c '.downloads'     > /tmp/payload/downloads
          else
            # workflow_dispatch: inputs 是字符串，直接写入
            printf '%s' '${{ inputs.version }}'       > /tmp/payload/version
            printf '%s' '${{ inputs.versionCode }}'    > /tmp/payload/versionCode
            printf '%s' '${{ inputs.publishedAt }}'    > /tmp/payload/publishedAt
            printf '%s' '${{ inputs.changelog }}'      > /tmp/payload/changelog
            printf '%s' '${{ inputs.downloads }}'      > /tmp/payload/downloads
          fi

          echo "version=$(cat /tmp/payload/version)"
          echo "versionCode=$(cat /tmp/payload/versionCode)"
          echo "publishedAt=$(cat /tmp/payload/publishedAt)"
          echo "changelog lines=$(wc -l < /tmp/payload/changelog)"
          echo "downloads=$(cat /tmp/payload/downloads)"

      - name: Fetch upstream changelog
        run: |
          # 从 rikkahub_mcp 仓库获取完整 changelog.md（公开仓库，无需认证）
          curl -sfS \
            -H "Accept: application/vnd.github.v3.raw" \
            "https://api.github.com/repos/topabomb/rikkahub_mcp/contents/docs/dev/changelog.md" \
            -o /tmp/upstream-changelog.md

          if [ ! -s /tmp/upstream-changelog.md ]; then
            echo "Failed to fetch upstream changelog" >&2
            exit 1
          fi
          echo "Fetched $(wc -l < /tmp/upstream-changelog.md) lines"

      - name: Update version.json
        run: |
          # 构建静态 version.json — App 更新检查的数据源
          # 格式与 App 端 UpdateInfo 数据模型完全匹配：
          #   version, versionCode, publishedAt, changelog, downloads[{name,url,size}]
          jq -n \
            --arg version "$(cat /tmp/payload/version)" \
            --argjson versionCode "$(cat /tmp/payload/versionCode)" \
            --arg publishedAt "$(cat /tmp/payload/publishedAt)" \
            --rawfile changelog /tmp/payload/changelog \
            --rawfile downloads /tmp/payload/downloads \
            '{
              version: $version,
              versionCode: $versionCode,
              publishedAt: $publishedAt,
              changelog: ($changelog | rtrimstr("\n")),
              downloads: ($downloads | rtrimstr("\n") | fromjson)
            }' > docs/.vuepress/public/version.json

          echo "=== version.json ==="
          cat docs/.vuepress/public/version.json

      - name: Update changelog page
        run: |
          # 用上游 changelog.md 正文替换 changelog/index.md 中标记之间的内容
          # 保留 frontmatter 和头部说明，只更新版本段落
          # 不使用 heredoc，避免 YAML run: | 中的缩进问题

          # 提取上游 changelog 正文（跳过标题和说明块）
          sed '/^# 功能迭代清单$/,/^---$/{ /^---$/!d; }' /tmp/upstream-changelog.md > /tmp/changelog-body.md

          # 用 printf 写入头部内容到临时文件
          printf '%s\n' \
            '---' \
            'title: 更新日志' \
            'icon: clock-rotate-left' \
            'author: Measix Pilot' \
            'date: 2026-08-15' \
            'category: 更新' \
            '---' \
            '' \
            '# 更新日志' \
            '' \
            '> 以下更新日志随每次版本发布自动同步，源自 [rikkahub_mcp 仓库](https://github.com/topabomb/rikkahub_mcp/blob/main/docs/dev/changelog.md)。' \
            '' \
            '::: tip 版本线说明' \
            'Measix Pilot 采用独立版本线（`0.0.x`），与上游 RikkaHub 版本线（`2.x.x`）独立。完整的上游同步分析详见 [上游同步文档](https://github.com/topabomb/rikkahub_mcp/blob/main/docs/dev/upstream-sync.md)。' \
            ':::' \
            '' \
            '<!-- CHANGELOG_CONTENT_START -->' \
            > /tmp/changelog-header.md

          # 拼接：头部 + 正文 + 结尾标记
          cat /tmp/changelog-header.md /tmp/changelog-body.md > docs/changelog/index.md
          echo "" >> docs/changelog/index.md
          echo "<!-- CHANGELOG_CONTENT_END -->" >> docs/changelog/index.md

          echo "=== changelog/index.md updated ==="

      - name: Update config.ts version info
        run: |
          VERSION=$(cat /tmp/payload/version)
          PUBLISHED_DATE=$(cat /tmp/payload/publishedAt | cut -dT -f1)

          sed -i "s/softwareVersion: \".*\"/softwareVersion: \"${VERSION}\"/" docs/.vuepress/config.ts
          sed -i "s/datePublished: \".*\"/datePublished: \"${PUBLISHED_DATE}\"/" docs/.vuepress/config.ts

          echo "config.ts: softwareVersion=${VERSION}, datePublished=${PUBLISHED_DATE}"

      - name: Commit and push
        run: |
          VERSION=$(cat /tmp/payload/version)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/.vuepress/public/version.json docs/changelog/index.md docs/.vuepress/config.ts

          # 检查是否有实际变更（避免空 commit）
          if git diff --cached --quiet; then
            echo "No changes to commit — data already up to date"
          else
            git commit -m "chore: sync version ${VERSION} from app release"
            git push
            echo "Pushed commit for version ${VERSION}"
          fi

      - name: Verify Vercel deployment
        run: |
          VERSION=$(cat /tmp/payload/version)
          echo "Waiting 90s for Vercel deployment..."
          sleep 90

          RESPONSE=$(curl -sfS "https://measix-pilot.weero.net/version.json" 2>/dev/null || echo "FETCH_FAILED")
          REMOTE_VERSION=$(echo "$RESPONSE" | jq -r '.version // empty' 2>/dev/null || echo "")

          if [ "$REMOTE_VERSION" = "$VERSION" ]; then
            echo "✅ Verified: https://measix-pilot.weero.net/version.json serves version $VERSION"
          else
            echo "⚠️ Verification: remote version='$REMOTE_VERSION' expected='$VERSION'"
            echo "(May be Vercel deployment delay — check Vercel dashboard)"
          fi
